spring:
  datasource:
    url: ${JDBC_DATABASE_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false
    properties:
      hibernate:
        default_schema: task_manager
  flyway:
    schemas: task_manager
    default-schema: task_manager

app:
  admin:
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}
  jwt:
    private-key: ${JWT_PRIVATE_KEY}
  mock-data:
    enabled: ${MOCK_DATA_ENABLED:false}